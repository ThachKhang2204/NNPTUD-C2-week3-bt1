<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Quản lý sản phẩm</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Dashboard - Danh sách sản phẩm</h1>
        <div class="loading" id="loading">Đang tải dữ liệu...</div>
        
        <!-- Tùy chọn số sản phẩm mỗi trang -->
        <div class="pagination-controls">
            <div class="items-per-page">
                <label for="itemsPerPage">Hiển thị:</label>
                <select id="itemsPerPage">
                    <option value="5">5 sản phẩm</option>
                    <option value="10" selected>10 sản phẩm</option>
                    <option value="20">20 sản phẩm</option>
                </select>
            </div>
            <div class="page-info">
                <span id="pageInfo">Trang 1 / 1</span>
            </div>
        </div>
        
        <div class="table-container">
            <table id="productTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Hình ảnh</th>
                        <th class="sortable" data-sort="name">
                            Tên sản phẩm
                            <span class="sort-icons">
                                <span class="sort-up">▲</span>
                                <span class="sort-down">▼</span>
                            </span>
                        </th>
                        <th class="sortable" data-sort="price">
                            Giá
                            <span class="sort-icons">
                                <span class="sort-up">▲</span>
                                <span class="sort-down">▼</span>
                            </span>
                        </th>
                        <th class="description-header">Mô tả</th>
                        <th>Danh mục</th>
                    </tr>
                </thead>
                <tbody id="productTableBody">
                    <!-- Dữ liệu sẽ được thêm vào đây -->
                </tbody>
            </table>
        </div>
        
        <!-- Phân trang -->
        <div class="pagination" id="pagination">
            <button id="firstPage" class="page-btn">«</button>
            <button id="prevPage" class="page-btn">‹</button>
            <div id="pageNumbers" class="page-numbers"></div>
            <button id="nextPage" class="page-btn">›</button>
            <button id="lastPage" class="page-btn">»</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
